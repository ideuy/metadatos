name: Actualizar Catálogo de Metadatos IDE

on:
  schedule:
    # Se ejecuta automáticamente todos los domingos a las 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permite ejecutar el proceso manualmente desde la pestaña Actions de GitHub

jobs:
  actualizar-catalogo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install tqdm

      - name: Ejecutar script de procesamiento
        run: |
          python scripts/procesar_catalogo.py

      - name: Guardar cambios si el catálogo fue modificado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add datos/catalogo.json
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: actualización automática del catálogo de metadatos" && git push)